[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/capture",
    "crates/detect",
    "crates/asr-proto",
    "crates/asr-worker",
    "crates/embed-worker",
    "crates/llm",
    "crates/pipeline",
    "crates/cli",
    "crates/app",
    "crates/runtime",
]

[workspace.package]
version = "0.15.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "warn"
