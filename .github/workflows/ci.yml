name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2
      - uses: actions/cache@v4
        with:
          path: ~/sherpa-onnx-libs
          key: sherpa-onnx-libs-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Fetch sherpa-onnx native libraries
        shell: bash
        run: ./scripts/fetch-sherpa-libs.sh
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libwayland-dev
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build Windows applications
        if: runner.os == 'Windows'
        run: cargo build --locked --release -p notetaker-cli -p notetaker-asr-worker -p notetaker-embed-worker -p notetaker-app -j 2
      - name: Verify portable ASR providers
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-asr-providers.ps1
      - name: Package Windows applications
        if: runner.os == 'Windows'
        id: package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Upload Windows applications
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: notetaker-windows-x64
          path: ${{ steps.package.outputs.payload }}
          if-no-files-found: error
      - name: Upload optional embedding worker
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: notetaker-windows-x64-embed
          path: |
            ${{ steps.package.outputs.embed }}
            ${{ steps.package.outputs.embed_checksum }}
          if-no-files-found: error
      - name: Build per-user installer
        if: runner.os == 'Windows'
        id: installer
        shell: pwsh
        env:
          PAYLOAD_DIR: ${{ steps.package.outputs.payload }}
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
          $version = ($metadata.packages | Where-Object name -eq 'notetaker-app').version
          ./scripts/package-installer.ps1 -Version $version -PayloadDir $env:PAYLOAD_DIR
      - name: Smoke-test per-user install, upgrade and uninstall
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        env:
          SETUP_EXE: ${{ steps.installer.outputs.setup }}
        run: ./scripts/check-installer.ps1 -SetupExe $env:SETUP_EXE
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: notetaker-windows-x64-installer
          path: |
            ${{ steps.installer.outputs.setup }}
            ${{ steps.installer.outputs.setup_checksum }}
          if-no-files-found: error

      - name: Prepare Apple Silicon packaging
        if: runner.os == 'macOS'
        env:
          SHERPA_TARGET_ARCH: arm64
        run: |
          rustup target add aarch64-apple-darwin
          ./scripts/fetch-sherpa-libs.sh
      - name: Build macOS applications
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.4'
        run: cargo build --locked --release --target aarch64-apple-darwin -p notetaker-app -p notetaker-cli -p notetaker-asr-worker -p notetaker-embed-worker -j 2
      - name: Smoke-test macOS bundle, signature and DMG
        if: runner.os == 'macOS'
        run: ./scripts/package-macos.sh --skip-build
      - name: Upload macOS applications
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: notetaker-macos-arm64
          path: |
            dist/notetaker-*-macos-arm64.dmg
            dist/notetaker-*-macos-arm64.dmg.sha256
          if-no-files-found: error
