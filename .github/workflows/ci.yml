name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2
      - uses: actions/cache@v4
        with:
          path: ~/sherpa-onnx-libs
          key: sherpa-onnx-libs-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Fetch sherpa-onnx native libraries
        shell: bash
        run: ./scripts/fetch-sherpa-libs.sh
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libwayland-dev
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build Windows applications
        if: runner.os == 'Windows'
        run: cargo build --locked --release -p notetaker-cli -p notetaker-asr-worker -p notetaker-app -j 2
      - name: Package Windows applications
        if: runner.os == 'Windows'
        id: package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Upload Windows applications
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: notetaker-windows-x64
          path: ${{ steps.package.outputs.payload }}
          if-no-files-found: error
      - name: Build per-user installer
        if: runner.os == 'Windows'
        id: installer
        shell: pwsh
        env:
          PAYLOAD_DIR: ${{ steps.package.outputs.payload }}
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
          $version = ($metadata.packages | Where-Object name -eq 'notetaker-app').version
          ./scripts/package-installer.ps1 -Version $version -PayloadDir $env:PAYLOAD_DIR
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: notetaker-windows-x64-installer
          path: |
            ${{ steps.installer.outputs.setup }}
            ${{ steps.installer.outputs.setup_checksum }}
          if-no-files-found: error
      - name: Smoke-test per-user install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SETUP_EXE: ${{ steps.installer.outputs.setup }}
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'notetaker-install-smoke'
          $process = Start-Process $env:SETUP_EXE -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$install`"", '/TASKS=autostart' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          foreach ($exe in 'notetaker-app.exe', 'notetaker.exe', 'notetaker-asr.exe', 'unins000.exe') {
            if (-not (Test-Path (Join-Path $install $exe))) { throw "Missing installed $exe" }
          }
          $shortcut = Join-Path $env:APPDATA 'Microsoft/Windows/Start Menu/Programs/notetaker.lnk'
          if (-not (Test-Path $shortcut)) { throw 'Start menu shortcut missing' }
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          if ((Get-ItemPropertyValue $run -Name notetaker) -ne "`"$install\notetaker-app.exe`"") { throw 'Autostart command mismatch' }
          $process = Start-Process (Join-Path $install 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller failed: $($process.ExitCode)" }
          if (Get-ItemProperty $run -Name notetaker -ErrorAction SilentlyContinue) { throw 'Autostart value survived uninstall' }
