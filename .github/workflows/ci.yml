name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2
      - uses: actions/cache@v4
        with:
          path: ~/sherpa-onnx-libs
          key: sherpa-onnx-libs-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Fetch sherpa-onnx native libraries
        shell: bash
        run: ./scripts/fetch-sherpa-libs.sh
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libwayland-dev
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build Windows applications
        if: runner.os == 'Windows'
        run: cargo build --locked --release -p notetaker-cli -p notetaker-asr-worker -p notetaker-app -j 2
      - name: Package Windows applications
        if: runner.os == 'Windows'
        id: package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Upload Windows applications
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: notetaker-windows-x64
          path: ${{ steps.package.outputs.payload }}
          if-no-files-found: error
