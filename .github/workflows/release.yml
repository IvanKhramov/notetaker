name: Release

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Published stable release version (e.g. 0.8.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # A tag builds a release only from a commit on main whose CI is green.
  gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the tagged commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Wait for green CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 80); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name | startswith("check (")) | .conclusion // "pending"]
                | if length >= 3 and all(. == "success") then "green"
                  elif any(. == "failure" or . == "cancelled" or . == "timed_out") then "red"
                  else "pending" end')
            echo "CI: $state"
            case "$state" in
              green) exit 0 ;;
              red) echo "CI failed on $GITHUB_SHA" >&2; exit 1 ;;
            esac
            sleep 30
          done
          echo "CI did not finish in time" >&2
          exit 1

  windows:
    if: github.event_name == 'push'
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        # Version, components and targets come from rust-toolchain.toml.
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/sherpa-onnx-libs
          key: sherpa-onnx-libs-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Fetch sherpa-onnx native libraries
        shell: bash
        run: ./scripts/fetch-sherpa-libs.sh
      - name: Build Windows applications
        run: cargo build --locked --release -p notetaker-cli -p notetaker-asr-worker -p notetaker-embed-worker -p notetaker-app
      - name: Verify portable ASR providers
        shell: pwsh
        run: ./scripts/check-asr-providers.ps1
      - name: Package Windows applications
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/package-windows.ps1 -Version ($env:RELEASE_TAG.Substring(1))
      - name: Build per-user installer
        id: installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PAYLOAD_DIR: ${{ steps.package.outputs.payload }}
        run: ./scripts/package-installer.ps1 -Version ($env:RELEASE_TAG.Substring(1)) -PayloadDir $env:PAYLOAD_DIR
      - name: Smoke-test per-user install, upgrade and uninstall
        timeout-minutes: 10
        shell: pwsh
        env:
          SETUP_EXE: ${{ steps.installer.outputs.setup }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-installer.ps1 -SetupExe $env:SETUP_EXE
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ZIP: ${{ steps.package.outputs.zip }}
          RELEASE_CHECKSUM: ${{ steps.package.outputs.checksum }}
          RELEASE_SETUP: ${{ steps.installer.outputs.setup }}
          SETUP_CHECKSUM: ${{ steps.installer.outputs.setup_checksum }}
          EMBED_EXE: ${{ steps.package.outputs.embed }}
          EMBED_CHECKSUM: ${{ steps.package.outputs.embed_checksum }}
        run: |
          $release = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($release | ConvertFrom-Json).isDraft) { throw 'Refusing to overwrite a published release' }
          } else {
            $version = [regex]::Escape($env:RELEASE_TAG.TrimStart('v'))
            $changelog = Get-Content -Raw CHANGELOG.md
            $section = [regex]::Match($changelog, "(?ms)^## \[$version\][^\r\n]*\r?\n(.*?)(?=^## |\z)")
            $notesArgs = @('--generate-notes')
            if ($section.Success -and $section.Groups[1].Value.Trim()) {
              $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
              Set-Content -LiteralPath $notesFile -Value $section.Groups[1].Value.Trim() -Encoding utf8
              $notesArgs = @('--notes-file', $notesFile)
            }
            gh release create $env:RELEASE_TAG --verify-tag --draft @notesArgs --title "notetaker $env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed' }
          }
          gh release upload $env:RELEASE_TAG $env:RELEASE_SETUP $env:SETUP_CHECKSUM $env:RELEASE_ZIP $env:RELEASE_CHECKSUM $env:EMBED_EXE $env:EMBED_CHECKSUM --clobber
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release upload failed' }

  macos:
    if: github.event_name == 'push'
    # macos-15 is an Apple Silicon runner; macos-14 retires in November 2026.
    runs-on: macos-15
    needs: windows
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.4'
      SHERPA_TARGET_ARCH: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        # Version, components and targets come from rust-toolchain.toml.
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: v2-macos-arm64
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/sherpa-onnx-libs
          key: sherpa-onnx-libs-macos-arm64-${{ hashFiles('Cargo.lock') }}
      - name: Fetch sherpa-onnx native libraries
        run: ./scripts/fetch-sherpa-libs.sh
      - name: Build and package Apple Silicon applications
        id: package
        run: ./scripts/package-macos.sh
      - name: Upload DMG to existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_DMG: ${{ steps.package.outputs.dmg }}
          RELEASE_CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          # A published release is final: a re-run must not replace its files.
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "Release $RELEASE_TAG is already published; refusing to replace its assets." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "$RELEASE_DMG" "$RELEASE_CHECKSUM" --clobber

  # Signs the installer checksum with a key that never leaves this job. It uses no
  # third-party actions: see docs/release-signing.md.
  sign:
    if: github.event_name == 'push'
    needs: macos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Sign the installer checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          expected=$(gh api -H 'Accept: application/vnd.github.raw' \
            "repos/$GITHUB_REPOSITORY/contents/crates/runtime/src/update.rs?ref=$GITHUB_SHA" \
            | sed -n 's/^pub const SIGNING_KEY: Option<&str> = Some("\([0-9a-f]\{64\}\)");$/\1/p')
          if [ -z "$expected" ]; then
            echo "Release signing is not enabled in this build; nothing to sign."
            exit 0
          fi
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "This build requires signed updates, but UPDATE_SIGNING_KEY is not set." >&2
            exit 1
          fi
          umask 077
          work=$(mktemp -d)
          trap 'rm -f "$work/key"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$work/key"
          actual=$(openssl pkey -in "$work/key" -pubout -outform DER | tail -c 32 | xxd -p -c 64)
          if [ "$actual" != "$expected" ]; then
            echo "UPDATE_SIGNING_KEY does not match the key built into the app." >&2
            exit 1
          fi
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*-windows-x64-setup.exe.sha256' --dir "$work/assets"
          for checksum in "$work"/assets/*.sha256; do
            openssl pkeyutl -sign -inkey "$work/key" -rawin -in "$checksum" \
              | xxd -p -c 256 > "$checksum.sig"
            gh release upload "$RELEASE_TAG" "$checksum.sig" --repo "$GITHUB_REPOSITORY" --clobber
          done

  winget:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    concurrency:
      group: winget-${{ github.event.release.tag_name || inputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate manifests from published release
        id: manifests
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: ./scripts/winget-manifests.ps1 -Version $env:RELEASE_VERSION
      - name: Attach manifests to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_DIR: ${{ steps.manifests.outputs.manifests }}
          VERSION: ${{ steps.manifests.outputs.version }}
        run: |
          $asset = "notetaker-$env:VERSION-winget.zip"
          Compress-Archive -Path "$env:MANIFEST_DIR/*.yaml" -DestinationPath $asset -Force
          gh release upload "v$env:VERSION" $asset --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Manifest upload failed' }
      - name: Submit update if configured
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ steps.manifests.outputs.version }}
          SETUP_URL: ${{ steps.manifests.outputs.url }}
        run: |
          if (-not $env:WINGET_CREATE_GITHUB_TOKEN) { Write-Host 'WINGET_TOKEN not configured; manifests attached only'; exit 0 }
          Invoke-WebRequest 'https://github.com/microsoft/winget-create/releases/download/v1.28.1.0/wingetcreate.exe' -OutFile wingetcreate.exe
          $expected = '63d980ba79e97042395bd6eb5992c2db9e01e9e7a8a22958a95c288f27310413'
          if ((Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash -ne $expected) { throw 'wingetcreate checksum mismatch' }
          ./wingetcreate.exe update IvanKhramov.Notetaker --version $env:VERSION --urls $env:SETUP_URL --submit
          if ($LASTEXITCODE -ne 0) { throw 'WinGet submission failed; first submission must be completed manually' }
