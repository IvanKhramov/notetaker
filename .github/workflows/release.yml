name: Release

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Published stable release version (e.g. 0.8.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # A tag builds a release only from a commit on main whose CI is green.
  gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require the tagged commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Wait for green CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 80); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name | startswith("check (")) | .conclusion // "pending"]
                | if length >= 3 and all(. == "success") then "green"
                  elif any(. == "failure" or . == "cancelled" or . == "timed_out") then "red"
                  else "pending" end')
            echo "CI: $state"
            case "$state" in
              green) exit 0 ;;
              red) echo "CI failed on $GITHUB_SHA" >&2; exit 1 ;;
            esac
            sleep 30
          done
          echo "CI did not finish in time" >&2
          exit 1

  windows:
    if: github.event_name == 'push'
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned Rust toolchain
        # Version, components and targets come from rust-toolchain.toml.
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: v2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/sherpa-onnx-libs
          key: sherpa-onnx-libs-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Fetch sherpa-onnx native libraries
        shell: bash
        run: ./scripts/fetch-sherpa-libs.sh
      - name: Build Windows applications
        run: cargo build --locked --release -p notetaker-cli -p notetaker-asr-worker -p notetaker-embed-worker -p notetaker-app
      - name: Verify portable ASR providers
        shell: pwsh
        run: ./scripts/check-asr-providers.ps1
      - name: Package Windows applications
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/package-windows.ps1 -Version ($env:RELEASE_TAG.Substring(1))
      - name: Build per-user installer
        id: installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PAYLOAD_DIR: ${{ steps.package.outputs.payload }}
        run: ./scripts/package-installer.ps1 -Version ($env:RELEASE_TAG.Substring(1)) -PayloadDir $env:PAYLOAD_DIR
      - name: Smoke-test per-user install, upgrade and uninstall
        timeout-minutes: 10
        shell: pwsh
        env:
          SETUP_EXE: ${{ steps.installer.outputs.setup }}
        run: ./scripts/check-installer.ps1 -SetupExe $env:SETUP_EXE
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ZIP: ${{ steps.package.outputs.zip }}
          RELEASE_CHECKSUM: ${{ steps.package.outputs.checksum }}
          RELEASE_SETUP: ${{ steps.installer.outputs.setup }}
          SETUP_CHECKSUM: ${{ steps.installer.outputs.setup_checksum }}
          EMBED_EXE: ${{ steps.package.outputs.embed }}
          EMBED_CHECKSUM: ${{ steps.package.outputs.embed_checksum }}
        run: |
          gh release create $env:RELEASE_TAG $env:RELEASE_SETUP $env:SETUP_CHECKSUM $env:RELEASE_ZIP $env:RELEASE_CHECKSUM $env:EMBED_EXE $env:EMBED_CHECKSUM --verify-tag --draft --generate-notes --title "notetaker $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed' }

  macos:
    if: github.event_name == 'push'
    # macos-15 is an Apple Silicon runner; macos-14 retires in November 2026.
    runs-on: macos-15
    needs: windows
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.4'
      SHERPA_TARGET_ARCH: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned Rust toolchain
        # Version, components and targets come from rust-toolchain.toml.
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: v2-macos-arm64
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/sherpa-onnx-libs
          key: sherpa-onnx-libs-macos-arm64-${{ hashFiles('Cargo.lock') }}
      - name: Fetch sherpa-onnx native libraries
        run: ./scripts/fetch-sherpa-libs.sh
      - name: Build and package Apple Silicon applications
        id: package
        run: ./scripts/package-macos.sh
      - name: Upload DMG to existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_DMG: ${{ steps.package.outputs.dmg }}
          RELEASE_CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: gh release upload "$RELEASE_TAG" "$RELEASE_DMG" "$RELEASE_CHECKSUM" --clobber

  winget:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    concurrency:
      group: winget-${{ github.event.release.tag_name || inputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate manifests from published release
        id: manifests
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: ./scripts/winget-manifests.ps1 -Version $env:RELEASE_VERSION
      - name: Attach manifests to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_DIR: ${{ steps.manifests.outputs.manifests }}
          VERSION: ${{ steps.manifests.outputs.version }}
        run: |
          $asset = "notetaker-$env:VERSION-winget.zip"
          Compress-Archive -Path "$env:MANIFEST_DIR/*.yaml" -DestinationPath $asset -Force
          gh release upload "v$env:VERSION" $asset --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Manifest upload failed' }
      - name: Submit update if configured
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ steps.manifests.outputs.version }}
          SETUP_URL: ${{ steps.manifests.outputs.url }}
        run: |
          if (-not $env:WINGET_TOKEN) { Write-Host 'WINGET_TOKEN not configured; manifests attached only'; exit 0 }
          Invoke-WebRequest 'https://aka.ms/wingetcreate/latest' -OutFile wingetcreate.exe
          ./wingetcreate.exe update IvanKhramov.Notetaker --version $env:VERSION --urls $env:SETUP_URL --submit --token $env:WINGET_TOKEN
          if ($LASTEXITCODE -ne 0) { throw 'WinGet submission failed; first submission must be completed manually' }
