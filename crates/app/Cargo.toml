[package]
name = "notetaker-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "notetaker-app"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6"
egui_extras = { version = "0.37", default-features = false, features = ["file", "image"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
egui_commonmark = { version = "0.26", default-features = false }
notetaker-asr-proto = { path = "../asr-proto" }
notetaker-capture = { path = "../capture" }
notetaker-detect = { path = "../detect" }
notetaker-core = { path = "../core" }
notetaker-llm = { path = "../llm" }
notetaker-pipeline = { path = "../pipeline" }
notetaker-runtime = { path = "../runtime", features = ["distribution"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
toml = "1"
uuid = { version = "1", features = ["v7"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }
global-hotkey = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }

# Resource compiler runs only on Windows build hosts; no runtime dependency.
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
