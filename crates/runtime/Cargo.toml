[package]
name = "notetaker-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
distribution = ["dep:semver", "dep:sha2", "dep:zip", "dep:serde", "dep:toml"]

[dependencies]
anyhow = "1"
directories = "6"
semver = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
zip = { version = "9.1.2", default-features = false, features = ["deflate"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
toml = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Pipes", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
