[package]
name = "notetaker-llm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pulldown-cmark = { version = "0.13.5", default-features = false }
anyhow = "1"
directories = "6"
notetaker-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1"
tempfile = "3"

# Match asr-worker: Schannel on Windows, rustls elsewhere.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Security_Credentials"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v7"] }
