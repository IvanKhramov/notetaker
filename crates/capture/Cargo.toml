[package]
name = "notetaker-capture"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
hound = "3.5"
ogg = "0.9"
opus-rs = "=0.1.40"
rubato = "0.16.2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
wasapi = "=0.26.0"
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_System_Performance"] }
sysinfo = { version = "0.38", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"
