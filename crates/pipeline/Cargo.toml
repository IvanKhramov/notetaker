[package]
name = "notetaker-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
notetaker-runtime = { path = "../runtime" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["now"] }
hound = "3.5"
notetaker-asr-proto = { path = "../asr-proto" }
notetaker-capture = { path = "../capture" }
notetaker-core = { path = "../core" }
opus-rs = "=0.1.40"
ogg = "0.9"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }
tempfile = "3"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
directories = "6"
tempfile = "3"
