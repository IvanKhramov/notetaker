[package]
name = "notetaker-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "notetaker"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
notetaker-asr-proto = { path = "../asr-proto" }
notetaker-capture = { path = "../capture" }
notetaker-core = { path = "../core" }
notetaker-llm = { path = "../llm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
