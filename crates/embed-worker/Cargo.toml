[package]
name = "notetaker-embed-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "notetaker-embed"
path = "src/main.rs"

[dependencies]
anyhow = "1"
notetaker-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std"] }
# Reuse the already pinned static ORT from the sherpa SDK, in this process only.
ort-sys = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "disable-linking"] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
